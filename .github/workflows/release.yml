name: Release

# Triggers when you push a version tag, e.g.:  git push --tags  (after `npm version`)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release and upload the tarball
  packages: write # publish the package to GitHub Packages
  id-token: write # OIDC token for npm trusted publishing (no NPM_TOKEN needed)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url + scope make setup-node write an .npmrc that authenticates
      # `npm publish` to GitHub Packages using NODE_AUTH_TOKEN below.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@f1anderz'

      # Trusted publishing (OIDC) to npmjs.org needs npm >= 11.5.1; setup-node's
      # bundled npm on node 22 is older, so bump it before installing deps.
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      # No committed lockfile in this repo, so use `npm install` (not `npm ci`).
      - name: Install dev dependencies
        run: npm install

      - name: Verify (typecheck, lint, tests)
        run: npm run typecheck && npm run lint && npm test -- --exclude "test/snapshot/**"

      - name: Build minified, source-free bundle
        run: npm run build

      # Publishes the minified, dist-only package to GitHub Packages. The built-in
      # GITHUB_TOKEN authenticates to the same repo's package registry — no extra secret.
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # package.json's publishConfig.registry points at GitHub Packages, so the
      # --registry flag here overrides it for a second publish to public npm.
      # Auth is via OIDC trusted publishing (id-token permission above) — no
      # NPM_TOKEN secret. Requires the trusted publisher to be configured on
      # npmjs.com for this repo + workflow file first (see setup notes).
      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org/ --access public --provenance


      # `npm pack` honors package.json "files": ["dist"], so the tarball contains
      # only the minified dist + .d.ts types + README + LICENSE — never src/ or sourcemaps.
      - name: Pack release tarball
        run: npm pack

      - name: Create GitHub Release with the built tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tgz --generate-notes --verify-tag
